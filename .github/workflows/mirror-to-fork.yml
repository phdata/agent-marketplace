# Mirror this repository's main branch to agent-marketplace-fork.
#
# The "fork" is not a GitHub fork — it is an independent internal repository that is
# kept as a mirror of this one, and it is what the claude.ai plugin marketplace syncs
# from. Without this workflow the two drift, and the marketplace serves stale plugins.
name: Mirror to fork

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual re-sync, e.g. after fixing a failed run

# Never let two mirror runs race: a later push must not land before an earlier one.
concurrency:
  group: mirror-to-fork
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Don't run from forks of this repo, which have no access to the secret.
    if: github.repository == 'phdata/agent-marketplace'
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the mirror needs full history, not a shallow clone
          persist-credentials: false

      # A GitHub App installation token, scoped to the mirror alone and minted per run.
      # Nothing long-lived is stored, and it is not tied to a person's account.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.MIRROR_APP_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          repositories: agent-marketplace-fork

      - name: Push main to the mirror
        env:
          # gh reads GH_TOKEN directly. Keeping the credential out of the remote URL avoids
          # the failure that broke the first run, where a malformed URL was rejected by curl
          # before any request went out — and printed part of the credential into the log.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Only main is mirrored, and only main's own content. The push trigger already
          # limits this to main, but workflow_dispatch lets the operator pick any ref in the
          # UI — a feature branch or a tag — and HEAD would then be that ref's commit. Pushing
          # it would publish the wrong tree as the mirror's main, so refuse instead.
          if [ "${GITHUB_REF_TYPE}" != "branch" ] || [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Refusing to mirror from ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}' —" \
                 "only main is mirrored. Re-run this workflow from main."
            exit 1
          fi

          # Let the GitHub CLI be git's credential helper. Nothing has to be URL-safe, no
          # token reaches the remote URL or argv, and gh owns the token handling.
          gh auth setup-git --hostname github.com

          # Force so the mirror tracks this repo exactly. A non-fast-forward here means
          # someone committed directly to the mirror; that work is intentionally discarded,
          # because the mirror is a copy and this repository is the source of truth.
          git push --force "https://github.com/phdata/agent-marketplace-fork.git" \
            "HEAD:refs/heads/main"
          echo "Mirrored main at $(git rev-parse --short HEAD) to phdata/agent-marketplace-fork"

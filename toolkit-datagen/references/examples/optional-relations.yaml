# An optional relationship: every order has a customer, only some have a promotion.
#
# Shows `affinity` and `fill`, which decide what happens to a child row when one of
# the tables it references did not produce a row on this pass. Here PROMOTION has
# far fewer rows than CUSTOMER, so it runs out first.
#
#   affinity: any   (the default) generate the row if *any* reference was generated;
#                   the missing ones come through as null, so that FK must be nullable
#   affinity: all   generate the row only when *every* reference was generated
#   affinity: <qualified.table>   generate only when that one table produced a row
#   fill: true      reuse the previous row's value for a missing reference instead
#                   of nulling it — works with any affinity
sourceType: snowflake
tables:
  - name: CUSTOMER
    database: SANDBOX
    schema: DEMO
    rows: 50
    columns:
      - name: CUSTOMER_ID
        primaryKey: true
        provider: UUIDv4
        dataType: VARCHAR
        precision: 36
      - name: FULL_NAME
        provider: FullName
        dataType: VARCHAR
        precision: 100

  - name: PROMOTION
    database: SANDBOX
    schema: DEMO
    rows: 5
    columns:
      - name: PROMOTION_ID
        primaryKey: true
        provider: NumberSequence
        config:
          start: 1
          step: 1
        dataType: NUMBER
        precision: 9
        scale: 0
      - name: PROMOTION_CODE
        provider: Buzzword
        dataType: VARCHAR
        precision: 40

  - name: ORDERS
    database: SANDBOX
    schema: DEMO
    rowGenerator:
      range: 1..3
      affinity: any
      fill: false
    columns:
      - name: ORDER_ID
        primaryKey: true
        provider: UUIDv4
        dataType: VARCHAR
        precision: 36
      # Always present: CUSTOMER outlasts PROMOTION, so this is never null.
      - name: CUSTOMER_ID
        foreignKey: SANDBOX.DEMO.CUSTOMER.CUSTOMER_ID
      # Often absent. With affinity: any a missing reference is null, so the column
      # must be nullable — generation fails otherwise.
      - name: PROMOTION_ID
        nullable: true
        foreignKey: SANDBOX.DEMO.PROMOTION.PROMOTION_ID
      - name: ORDERED_AT
        provider: RandomTimestamp
        dataType: TIMESTAMP_NTZ
